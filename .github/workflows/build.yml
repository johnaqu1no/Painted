name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Build
        run: swift build

      - name: Run test suite
        run: swift run SketchySelfTest

      - name: Build app bundle
        run: ./build.sh release

      - name: Package
        run: ditto -c -k --keepParent dist/Sketchy.app Sketchy.zip

      - name: Upload app
        uses: actions/upload-artifact@v5
        with:
          name: Sketchy-macos
          path: Sketchy.zip
          if-no-files-found: error

  release:
    name: Sign, notarize and publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write

    # Secrets are not readable from `if:` at step level, so they are mapped to
    # env here. Missing credentials produce an unsigned build rather than a
    # failed one, which keeps tagging useful before the Apple account exists.
    env:
      CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - name: Build app
        run: ./build.sh release

      - name: Import signing certificate
        if: env.CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign the app
        if: env.CERT_P12 != ''
        run: |
          # Hardened runtime is required for notarization.
          codesign --force --deep --timestamp --options runtime \
            --sign "$SIGN_IDENTITY" dist/Sketchy.app
          codesign --verify --strict --verbose=2 dist/Sketchy.app

      - name: Package disk image
        run: tools/make-dmg.sh "${GITHUB_REF_NAME#v}"

      - name: Notarize and staple
        if: env.APPLE_ID != ''
        run: |
          DMG="dist/Sketchy-${GITHUB_REF_NAME#v}.dmg"
          xcrun notarytool submit "$DMG" --wait \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Sketchy-${GITHUB_REF_NAME#v}.dmg" \
            --title "Sketchy $GITHUB_REF_NAME" \
            --generate-notes
